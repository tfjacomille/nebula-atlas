# Publishes both versions of Nebula Atlas to ONE GitHub Pages site:
#   /nebula-atlas/v1/  ← branch 1.0.0 (plain HTML + Leaflet)
#   /nebula-atlas/v2/  ← branch 2.0.0 (React + MUI, built with Vite)
#
# Put this same file in BOTH branches, so a push to either one redeploys the site.

name: Deploy versions to GitHub Pages

on:
  push:
    branches: ["1.0.0", "2.0.0"]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  REPO_NAME: nebula-atlas # change if your repo has another name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 1.0.0 (HTML map)
        uses: actions/checkout@v4
        with:
          ref: "1.0.0"
          path: v1

      - name: Check out 2.0.0 (React + MUI)
        uses: actions/checkout@v4
        with:
          ref: "2.0.0"
          path: v2

      - name: Set up Node
        if: hashFiles('v2/frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the React app for /v2/
        if: hashFiles('v2/frontend/package.json') != ''
        working-directory: v2/frontend
        run: |
          npm ci
          npm run build -- --base=/${REPO_NAME}/v2/

      - name: Assemble the site
        run: |
          mkdir -p site/v1 site/v2

          # v1: use docs/ if the branch has one, otherwise the repo root
          if [ -d v1/docs ]; then SRC=v1/docs; else SRC=v1; fi
          cp -r "$SRC"/. site/v1/
          rm -rf site/v1/.git site/v1/.github site/v1/README.md site/v1/LICENSE

          # v2: the Vite build output, if it was built
          if [ -d v2/frontend/dist ]; then
            cp -r v2/frontend/dist/. site/v2/
          else
            echo '<p style="font-family:sans-serif">Version 2.0.0 is coming soon.</p>' > site/v2/index.html
          fi

          # Landing page at the root that links to both versions
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Nebula Atlas</title>
            <style>
              body { margin: 0; min-height: 100vh; display: grid; place-items: center;
                     font-family: system-ui, sans-serif; background: #17262b; color: #f5f2ea; }
              main { text-align: center; padding: 24px; }
              h1 { margin: 0 0 4px; } p { color: #bccbc8; margin: 0 0 24px; }
              a { display: block; margin: 12px auto; max-width: 320px; padding: 14px 20px;
                  border-radius: 10px; background: #22363c; color: #f5f2ea; text-decoration: none; }
              a:hover { background: #2f454b; } a b { color: #e8834a; }
            </style>
          </head>
          <body>
            <main>
              <h1>Nebula Atlas</h1>
              <p>Every map 🗺️ starts as a nebula 🌌</p>
              <a href="v1/"><b>v1.0.0</b> · HTML + Leaflet map</a>
              <a href="v2/"><b>v2.0.0</b> · React + MUI dashboard</a>
            </main>
          </body>
          </html>
          HTML

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
