<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Dashboard v1.0.0</title>

  <!-- Leaflet: the map library (CSS first, then JS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ---------- Page layout ---------- */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #17262b;
      color: #f5f2ea;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* phones: excludes the browser's address bar */
    }
    header {
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; }
    h1 span { color: #e8834a; }

    .subtitle { display: block; margin-top: 2px; font-size: 13px; color: #bccbc8; }
    @media (max-width: 640px) { .subtitle { font-size: 11px; } }

    /* ---------- KPI cards ---------- */
    .kpis { display: flex; gap: 12px; flex-wrap: wrap; }
    .kpi {
      background: #22363c;
      border-radius: 10px;
      padding: 8px 16px;
      min-width: 140px;
    }
    .kpi small { display: block; color: #bccbc8; font-size: 12px; }
    .kpi strong { font-size: 22px; }

    /* ---------- The map fills the rest of the page ---------- */
    #map { flex: 1; }

    /* ---------- Legend box ---------- */
    .legend {
      background: #fffdf7;
      color: #17262b;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 14px;
    }
    .dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ---------- Station popup (on click) ---------- */
    .station-popup .leaflet-popup-content-wrapper {
      background: #17262b;
      color: #f5f2ea;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .station-popup .leaflet-popup-tip { background: #17262b; }
    .station-popup .leaflet-popup-content { margin: 14px 16px; min-width: 200px; }
    .station-popup a.leaflet-popup-close-button { color: #bccbc8; }

    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding-right: 14px; /* room for the close button */
    }
    .popup-id { font-size: 18px; font-weight: 700; }
    .popup-type {
      display: block;
      font-size: 12px;
      color: #bccbc8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
    }
    .popup-rows {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      font-size: 13px;
      border-top: 1px solid #2f454b;
      padding-top: 10px;
    }
    .popup-rows dt { color: #bccbc8; }
    .popup-rows dd { margin: 0; text-align: right; font-weight: 600; }

    /* ---------- Station label (on hover) ---------- */
    .station-tooltip {
      background: #17262b;
      color: #f5f2ea;
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .station-tooltip::before { border-top-color: #17262b; }

    .popup-link { margin: 10px 0 0; font-size: 13px; }
    .popup-link a { color: #e8834a; font-weight: 600; text-decoration: none; }
    .popup-link a:hover { text-decoration: underline; }

    .dot-big {
      width: 16px; height: 16px;
      background: #bccbc8;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px #bccbc8;
    }
    .legend-note { margin-top: 6px; font-size: 11px; color: #4b5a5f; line-height: 1.4; }

    /* ---------- "About this map" info box ---------- */
    .about { max-width: 320px; }
    .about-btn {
      background: #17262b;
      color: #f5f2ea;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font: 600 14px system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .about-btn:hover { background: #22363c; }
    .about-panel {
      display: none;
      margin-top: 8px;
      background: #17262b;
      color: #f5f2ea;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .about.open .about-panel { display: block; }
    /* Fit the panel on screen (scroll if needed) and draw it above the legend and year filter */
    .about-panel { max-height: calc(100dvh - 260px); overflow-y: auto; }
    .leaflet-top.leaflet-left:has(.about.open),
    .leaflet-top.leaflet-left:has(.about:hover) { z-index: 1001; }
    /* Open on hover only where there's a real mouse (not on phones) */
    @media (hover: hover) {
      .about:hover .about-panel { display: block; }
    }
    .about-panel h3 { margin: 0 0 6px; font-size: 15px; color: #e8834a; }
    .about-panel p { margin: 0 0 8px; }
    .about-panel ul { margin: 0 0 8px; padding-left: 18px; }
    .about-panel a { color: #e8834a; font-weight: 600; }
    .about-panel small { color: #bccbc8; }
    .about-photo { margin: 0 0 12px; }
    .photo-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
    }
    .about-photo img {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: center 35%; /* keep the antenna in the crop */
      border-radius: 8px;
    }
    .photo-hint {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(23, 38, 43, 0.85);
      color: #f5f2ea;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .about-photo figcaption { margin-top: 4px; font-size: 11px; color: #bccbc8; }

    /* ---------- Full-screen photo viewer ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000; /* above every map control */
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(10, 18, 21, 0.97);
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(1100px, 100%);
      max-height: 75dvh;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .lightbox-caption {
      max-width: 720px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #bccbc8;
      cursor: auto;
    }
    .lightbox-caption b { color: #f5f2ea; }
    .lightbox-caption a { color: #e8834a; font-weight: 600; }
    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #22363c;
      color: #f5f2ea;
      font-size: 22px;
      cursor: pointer;
    }

    /* ---------- Year filter (bottom-left) ---------- */
    .year-filter {
      background: #fffdf7;
      color: #17262b;
      padding: 12px 14px;
      border-radius: 8px;
      width: 240px;
      font-size: 13px;
    }
    .year-head { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
    #year-label { font-weight: 700; color: #b8501c; }
    .year-filter label {
      display: grid;
      grid-template-columns: 40px 1fr; /* same label width, so both sliders line up */
      align-items: center;
      margin: 4px 0;
    }
    .year-filter input[type="range"] { width: 100%; margin: 0; accent-color: #2f6fb0; }
    .year-actions { display: flex; gap: 8px; margin-top: 8px; }
    .year-actions button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font: 600 13px system-ui, sans-serif;
      cursor: pointer;
      background: #17262b;
      color: #f5f2ea;
    }
    .year-actions button + button { background: #e3ddd0; color: #17262b; }

    /* Hide the square focus box browsers draw around a clicked marker */
    path.leaflet-interactive:focus { outline: none; }

    /* ---------- Phones (640px wide or less) ---------- */
    @media (max-width: 640px) {
      header { padding: 10px 12px; gap: 8px; }
      h1 { font-size: 16px; }

      /* Four small KPI cards in one row */
      .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
      .kpi { min-width: 0; padding: 6px 8px; border-radius: 8px; }
      .kpi small { font-size: 10px; line-height: 1.2; }
      .kpi strong { font-size: 16px; }

      /* Compact legend (it moves to the top-right on phones) */
      .legend { padding: 6px 10px; font-size: 12px; line-height: 1.6; }
      .legend .dot { width: 10px; height: 10px; }
      .legend .dot-big { width: 13px; height: 13px; }
      .legend-note { display: none; }

      /* Year filter stretches across the bottom */
      .year-filter { width: calc(100vw - 20px); padding: 10px 12px; }
      .year-actions button { padding: 8px; } /* bigger tap targets */

      /* About panel fits the screen and scrolls if needed */
      .about { max-width: calc(100vw - 20px); }
      .about-panel { max-height: 45dvh; overflow-y: auto; }
      .about-photo img { height: 120px; }
      .lightbox-caption { font-size: 13px; }

      .leaflet-control-attribution { font-size: 9px; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1><span>PAGeNet Stations</span> · NAMRIA</h1>
      <small class="subtitle">Philippine Active Geodetic Network: GNSS reference stations across the Philippines</small>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Stations</small><strong id="kpi-total">–</strong></div>
      <div class="kpi"><small>IGS stations</small><strong id="kpi-igs">–</strong></div>
      <div class="kpi"><small>Provinces covered</small><strong id="kpi-provinces">–</strong></div>
      <div class="kpi"><small>Newest install</small><strong id="kpi-newest">–</strong></div>
    </div>
  </header>

  <div id="map"></div>

  <!-- Your private settings (API keys). Copy config.example.js to config.js. Optional. -->
  <script src="config.js" onerror="console.info('No config.js found: keyed basemaps are off.')"></script>

  <script>
    // 1. Create the map. Leaflet wants [lat, lon] here, the REVERSE of GeoJSON!
    const map = L.map("map").setView([12.5, 122.0], 6); // the whole Philippines

    // 2. Basemaps. Each one is a tile layer; always credit the data source.
    const basemaps = {
      "Streets (OpenStreetMap)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }),
      "Satellite (Esri)": L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
        }
      ),
      "Topographic (OpenTopoMap)": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        maxZoom: 17,
        attribution: "&copy; OpenStreetMap contributors, SRTM | Style: &copy; OpenTopoMap (CC-BY-SA)",
      }),
    };

    // CARTO basemaps. The API key comes from config.js (see config.example.js).
    // Works whether config.js uses `window.NEBULA_CONFIG = {...}` or `const NEBULA_CONFIG = {...}`.
    const config = typeof NEBULA_CONFIG !== "undefined" ? NEBULA_CONFIG : (window.NEBULA_CONFIG || {});
    const cartoKey = config.CARTO_API_KEY;
    console.info(cartoKey ? "CARTO key loaded from config.js" : "No CARTO key found: CARTO tiles may not load");

    // CARTO expects the key as ?key=YOUR_KEY (see github.com/CartoDB/basemap-styles)
    const keyParam = cartoKey ? `?key=${encodeURIComponent(cartoKey)}` : "";
    const cartoOptions = { maxZoom: 20, attribution: "&copy; OpenStreetMap contributors &copy; CARTO" };
    basemaps["Light (CARTO)"] = L.tileLayer(
      `https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png${keyParam}`, cartoOptions
    );
    basemaps["Dark (CARTO)"] = L.tileLayer(
      `https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png${keyParam}`, cartoOptions
    );

    // Start on CARTO Light when there's a key; otherwise fall back to Streets
    const defaultBasemap = cartoKey ? "Light (CARTO)" : "Streets (OpenStreetMap)";
    basemaps[defaultBasemap].addTo(map);

    // Phones get a more compact layout (matches the @media rule in the CSS)
    const isPhone = window.matchMedia("(max-width: 640px)").matches;

    // Add the switcher (top-right corner). On phones it folds into a small icon.
    const layerSwitcher = L.control.layers(basemaps, {}, { collapsed: isPhone }).addTo(map);

    // 3. Color stations by when they were installed. Pair color with text (legend + popup).
    const eras = [
      { label: "2008–2012", from: 2008, to: 2012, color: "#8b1e3f" }, // dark red: the first stations
      { label: "2013–2018", from: 2013, to: 2018, color: "#e8834a" }, // orange
      { label: "2019–2025", from: 2019, to: 2025, color: "#2f6fb0" }, // blue: the newest
    ];
    const eraOf = (year) => eras.find((e) => year >= e.from && year <= e.to) ?? eras[eras.length - 1];

    // 4. Load the GeoJSON file and draw it
    fetch("pagenet_stations.geojson")
      .then((response) => response.json())
      .then((data) => {
        const layer = L.geoJSON(data, {
          // Draw each Point as a colored circle instead of the default pin.
          // IGS stations (part of the global network) get a bigger circle.
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: feature.properties.igs_station ? 11 : 7,
              color: "#ffffff",
              weight: 2,
              fillColor: eraOf(feature.properties.year_installed).color,
              fillOpacity: 0.9,
            }),

          onEachFeature: (feature, marker) => {
            const p = feature.properties;
            const era = eraOf(p.year_installed);

            // Hover: a small label with the station code
            marker.bindTooltip(p.station_code, {
              direction: "top",
              offset: [0, -8],
              className: "station-tooltip",
            });

            // Click: a card with all the properties
            marker.bindPopup(`
              <div class="popup-head">
                <div>
                  <span class="popup-id">${p.station_code}</span>
                  <span class="popup-type">${p.igs_station ? "PAGeNet · IGS" : "PAGeNet"}</span>
                </div>
                <span class="pill" style="background:${era.color}">${p.year_installed}</span>
              </div>
              <dl class="popup-rows">
                <dt>Location</dt>  <dd>${p.location}</dd>
                <dt>Province</dt>  <dd>${p.province}</dd>
                <dt>Installed</dt> <dd>${p.year_installed}</dd>
              </dl>
              <p class="popup-link"><a href="${p.pagenet_url}" target="_blank" rel="noopener">Station page on NAMRIA →</a></p>
            `, { className: "station-popup" });
          },
        }).addTo(map);

        // Let users turn the stations on and off in the same switcher
        layerSwitcher.addOverlay(layer, "PAGeNet stations");

        // Zoom the map to fit all stations (less padding on small screens)
        map.fitBounds(layer.getBounds(), { padding: isPhone ? [10, 10] : [30, 30] });

        // Keep every marker so the filter can show and hide them
        const allMarkers = layer.getLayers();
        const years = allMarkers.map((m) => m.feature.properties.year_installed);
        const firstYear = Math.min(...years);
        const lastYear = Math.max(...years);

        // 5. KPIs: computed from the stations currently shown
        function updateKpis(stations) {
          const igs = stations.filter((s) => s.igs_station);
          const provinces = new Set(stations.map((s) => s.province));
          const newest = stations.length ? Math.max(...stations.map((s) => s.year_installed)) : "–";

          document.getElementById("kpi-total").textContent = stations.length;
          document.getElementById("kpi-igs").textContent = igs.length;
          document.getElementById("kpi-provinces").textContent = provinces.size;
          document.getElementById("kpi-newest").textContent = newest;
        }

        // 6. Year filter: show only stations installed from `from` to `to`
        function applyYearFilter(from, to) {
          const shown = [];
          allMarkers.forEach((marker) => {
            const year = marker.feature.properties.year_installed;
            if (year >= from && year <= to) {
              layer.addLayer(marker);
              shown.push(marker.feature.properties);
            } else {
              layer.removeLayer(marker);
            }
          });
          updateKpis(shown);
        }

        addYearFilter(firstYear, lastYear, applyYearFilter);
        applyYearFilter(firstYear, lastYear);
      })
      .catch((error) => {
        // Most common cause: opening this file directly instead of through a server
        alert("Couldn't load the GeoJSON. Run: python -m http.server 8080");
        console.error(error);
      });

    // 6. Add a legend: bottom-right on laptops, top-right on phones (the year filter needs the bottom)
    const legend = L.control({ position: isPhone ? "topright" : "bottomright" });
    legend.onAdd = () => {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        "<b>Installed</b><br>" +
        eras.map((e) => `<span class="dot" style="background:${e.color}"></span>${e.label}`).join("<br>") +
        '<br><span class="dot dot-big"></span>IGS station' +
        '<div class="legend-note">Town Center Positions are <br> approximate for demo only.</div>';
      return div;
    };
    legend.addTo(map);

    // 7. "About this map": hover (desktop) or tap (phone) to explain PAGeNet
    const about = L.control({ position: "topleft" });
    about.onAdd = () => {
      const div = L.DomUtil.create("div", "about");
      div.innerHTML = `
        <button class="about-btn" type="button" aria-expanded="false">ⓘ About this map</button>
        <div class="about-panel">
          <!-- Photo: the local copy in img/ first. If that's missing, try NAMRIA's site;
               if that fails too, the photo box hides itself. -->
          <figure class="about-photo">
            <button class="photo-button" type="button" aria-label="Enlarge the station photo">
              <img src="sample_pagenet_gnss.jpg"
                   alt="A PAGeNet GNSS reference station: a white dome antenna on a fixed mount inside a fenced enclosure"
                   referrerpolicy="no-referrer" loading="lazy"
                   data-fallback="https://pagenet.namria.gov.ph/AGN/SitePictures/PBOR/PBOR_North.jpg"
                   onerror="if (this.dataset.fallback) { this.src = this.dataset.fallback; delete this.dataset.fallback; } else { this.closest('figure').remove(); }">
              <span class="photo-hint">⤢ Enlarge</span>
            </button>
            <figcaption>A PAGeNet reference station · Photo: <a href="https://pagenet.namria.gov.ph/AGN/AGSmain.aspx" target="_blank" rel="noopener">NAMRIA PAGeNet</a></figcaption>
          </figure>
          <h3>What is PAGeNet?</h3>
          <p>The <b>Philippine Active Geodetic Network</b>: NAMRIA's network of permanent,
          continuously operating GNSS reference stations, started in 2008.</p>
          <ul>
            <li>Sends <b>real-time corrections</b> over the internet (NTRIP) for precise RTK positioning</li>
            <li>Shares <b>RINEX data</b> for post-processing your GNSS surveys</li>
            <li>Three stations (PTAG, PPPC, PGEN) are also part of the global <b>IGS</b> network</li>
          </ul>
          <p>Think of each station as a benchmark that never sleeps: your rover measures relative to it.</p>
          <small>Reference list: <a href="https://pagenet.namria.gov.ph/AGN/AGSmain.aspx" target="_blank" rel="noopener">NAMRIA PAGeNet</a>.
          Map positions are approximate (town centers) and for demo purposes only.</small>
        </div>`;

      // Tap/click to keep it open (useful on phones, where there's no hover)
      const button = div.querySelector(".about-btn");
      button.addEventListener("click", () => {
        const open = div.classList.toggle("open");
        button.setAttribute("aria-expanded", open);
      });

      // Click the photo to see it full screen
      const photoButton = div.querySelector(".photo-button");
      if (photoButton) {
        photoButton.addEventListener("click", () => openLightbox(photoButton.querySelector("img")));
      }

      // Stop clicks and scrolls inside the box from moving the map
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    about.addTo(map);

    // 7b. Full-screen photo viewer ("lightbox"). Close with ✕, a click outside the text, or Esc.
    const lightbox = document.createElement("div");
    lightbox.className = "lightbox";
    lightbox.setAttribute("role", "dialog");
    lightbox.setAttribute("aria-modal", "true");
    lightbox.setAttribute("aria-label", "Station photo");
    lightbox.innerHTML = `
      <button class="lightbox-close" type="button" aria-label="Close">✕</button>
      <img alt="">
      <p class="lightbox-caption">
        <b>What you're looking at:</b> the white dome is the <b>GNSS antenna</b>, bolted to a fixed mount
        so it never moves. The cabinet holds the <b>receiver</b> and power supply, which stream data to NAMRIA
        around the clock. The fence keeps people and animals away from the antenna.<br>
        Photo: <a href="https://pagenet.namria.gov.ph/AGN/AGSmain.aspx" target="_blank" rel="noopener">NAMRIA PAGeNet</a>
      </p>`;
    document.body.appendChild(lightbox);

    function openLightbox(thumbnail) {
      const big = lightbox.querySelector("img");
      big.src = thumbnail.currentSrc || thumbnail.src;
      big.alt = thumbnail.alt;
      lightbox.classList.add("open");
      lightbox.querySelector(".lightbox-close").focus();
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
    }
    lightbox.addEventListener("click", (event) => {
      // Clicking the caption text (or its link) doesn't close the viewer
      if (!event.target.closest(".lightbox-caption")) closeLightbox();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeLightbox();
    });

    // 8. The year filter box (bottom-left): "From" and "To" sliders plus a ▶ button
    //    that plays the network growing year by year.
    function addYearFilter(firstYear, lastYear, onChange) {
      const control = L.control({ position: "bottomleft" });
      control.onAdd = () => {
        const div = L.DomUtil.create("div", "year-filter");
        div.innerHTML = `
          <div class="year-head">
            <b>Installed</b>
            <span id="year-label">${firstYear}–${lastYear}</span>
          </div>
          <label>From <input id="year-from" type="range" min="${firstYear}" max="${lastYear}" value="${firstYear}"></label>
          <label>To <input id="year-to" type="range" min="${firstYear}" max="${lastYear}" value="${lastYear}"></label>
          <div class="year-actions">
            <button id="year-play" type="button">▶ Play</button>
            <button id="year-reset" type="button">Reset</button>
          </div>`;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      };
      control.addTo(map);

      const fromInput = document.getElementById("year-from");
      const toInput = document.getElementById("year-to");
      const label = document.getElementById("year-label");
      const playButton = document.getElementById("year-play");
      let timer = null;

      function update(changed) {
        let from = Number(fromInput.value);
        let to = Number(toInput.value);
        // Don't let the sliders cross
        if (from > to) {
          if (changed === fromInput) toInput.value = to = from;
          else fromInput.value = from = to;
        }
        label.textContent = from === to ? `${from}` : `${from}–${to}`;
        onChange(from, to);
      }

      function stop() {
        clearInterval(timer);
        timer = null;
        playButton.textContent = "▶ Play";
      }

      fromInput.addEventListener("input", () => { stop(); update(fromInput); });
      toInput.addEventListener("input", () => { stop(); update(toInput); });

      // Play: start at the first year and add one year every 0.7 seconds
      playButton.addEventListener("click", () => {
        if (timer) return stop();
        fromInput.value = firstYear;
        toInput.value = firstYear;
        update(toInput);
        playButton.textContent = "⏸ Pause";
        timer = setInterval(() => {
          if (Number(toInput.value) >= lastYear) return stop();
          toInput.value = Number(toInput.value) + 1;
          update(toInput);
        }, 700);
      });

      document.getElementById("year-reset").addEventListener("click", () => {
        stop();
        fromInput.value = firstYear;
        toInput.value = lastYear;
        update(toInput);
      });
    }
